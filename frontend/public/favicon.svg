<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep Obsidian Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E24" />
      <stop offset="100%" stop-color="#080C0E" />
    </linearGradient>

    <!-- Thermal Heat to Cool Relief Dynamic Shift Gradient -->
    <linearGradient id="thermalShift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shieldBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Background Radar Concentric Ring (FortyGuard Satellite Precision) -->
  <circle cx="32" cy="32" r="23" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="32" cy="32" r="16" stroke="#334155" stroke-width="1" opacity="0.25" />

  <!-- ThermaShift Monogram (T + Delta Vector Shield) -->
  <g filter="url(#subtleGlow)">
    <!-- Top Horizontal Crossbar with Thermal Gradient -->
    <path
      d="M18 19C18 17.3431 19.3431 16 21 16H43C44.6569 16 46 17.3431 46 19C46 20.6569 44.6569 22 43 22H21C19.3431 22 18 20.6569 18 19Z"
      fill="url(#thermalShift)"
    />

    <!-- Dynamic Shift Chevron & Vertical Stem (Relocation Vector) -->
    <path
      d="M32 24V47M32 47L22 36M32 47L42 36"
      stroke="url(#thermalShift)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Microclimate Core Node -->
    <circle cx="32" cy="28" r="3.5" fill="#FFFFFF" />
    <circle cx="32" cy="47" r="2.5" fill="#06B6D4" />
  </g>
</svg>
